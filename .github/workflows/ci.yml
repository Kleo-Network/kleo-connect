name: UI CI

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - production

# Default-deny: jobs that need write scopes must opt up explicitly.
# Prevents the GitHub Actions Cache poisoning + OIDC-token-write attack chain
# documented in the May 2026 TanStack supply-chain compromise.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    name: Lint
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: yarn
      - run: yarn lint
  build:
    runs-on: ubuntu-22.04
    needs: lint
    name: Build
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: yarn
      - run: yarn build
  test:
    runs-on: ubuntu-22.04
    needs: build
    name: Test
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: yarn
      - run: yarn test
